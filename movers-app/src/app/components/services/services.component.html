<section class="section services">
  <h2>Our Moving Services in Toronto</h2>
  <div class="grid">
    <mat-card class="card" *ngFor="let service of services">
      <mat-card-header>
        <mat-card-title>{{ service.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ service.description }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</section>
