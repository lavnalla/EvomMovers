<div *ngFor="let service of services" class="service-container">
  <mat-card class="service-card">
    <mat-card-header>
      <mat-card-title>{{ service.title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{ service.description }}</p>
    </mat-card-content>
  </mat-card>
</div>
